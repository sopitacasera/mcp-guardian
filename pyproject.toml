[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-guardian"
version = "0.1.0"
description = "Framework-agnostic MCP server security scanner with audit-grade reports"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "sopitacasera", email = "johanna28h2@gmail.com" }]
keywords = ["mcp", "security", "llm", "ai-security", "prompt-injection", "tool-poisoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "bandit[toml]>=1.7",
  "pre-commit>=3.7",
  "mypy>=1.10",
]

[project.scripts]
mcp-guardian = "mcp_guardian.cli:app"

[project.urls]
Homepage = "https://github.com/sopitacasera/mcp-guardian"
Repository = "https://github.com/sopitacasera/mcp-guardian"
Issues = "https://github.com/sopitacasera/mcp-guardian/issues"
Changelog = "https://github.com/sopitacasera/mcp-guardian/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_guardian"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN001", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mcp_guardian --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["mcp_guardian"]

[tool.bandit]
targets = ["src"]
skips = ["B101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
